<!DOCTYPE html>
<html>
<head>
  <title>Student Admission Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4">
  <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-lg border">
    <h1 class="text-3xl font-black text-center">College Admission Form</h1>
    <hr class="my-6">
    <form action="/submit" method="POST" class="space-y-5">

      <div>
        <label class="font-bold">Program Applied for:</label>
        <div class="mt-2 space-y-2 text-sm bg-slate-50 p-3 rounded-lg">
          <label class="flex gap-2"><input type="checkbox" name="programs" value="BCA"> Bachelor's Of Computer Application (BCA)</label>
          <label class="flex gap-2"><input type="checkbox" name="programs" value="BA"> Bachelor's Of Arts (BA)</label>
          <label class="flex gap-2"><input type="checkbox" name="programs" value="Hardware"> Computer Hardware Technician</label>
          <label class="flex gap-2"><input type="checkbox" name="programs" value="Electrician"> General Electrician</label>
        </div>
      </div>

      <div>
        <label class="font-bold">Full Name Of Applicant</label>
        <div class="grid md:grid-cols-3 gap-3 mt-2">
          <input type="text" name="first_name" placeholder="First *" required class="border p-2.5 rounded-lg">
          <input type="text" name="middle_name" placeholder="Middle" class="border p-2.5 rounded-lg">
          <input type="text" name="last_name" placeholder="Last *" required class="border p-2.5 rounded-lg">
        </div>
      </div>

      <div>
        <label class="font-bold">Parent / Guardian's Name</label>
        <div class="grid md:grid-cols-3 gap-3 mt-2">
          <input type="text" name="g_first" placeholder="First" class="border p-2.5 rounded-lg">
          <input type="text" name="g_middle" placeholder="Middle" class="border p-2.5 rounded-lg">
          <input type="text" name="g_last" placeholder="Last" class="border p-2.5 rounded-lg">
        </div>
      </div>

      <div>
        <label class="font-bold">Parent / Guardian's Occupation</label>
        <input type="text" name="occupation" class="w-full border p-2.5 rounded-lg mt-2">
      </div>

      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="font-bold">Date of birth</label>
          <input type="date" name="dob" class="w-full border p-2.5 rounded-lg mt-2">
        </div>
        <div>
          <label class="font-bold">Gender</label>
          <div class="flex gap-4 mt-3">
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
          </div>
        </div>
      </div>

      <div>
        <label class="font-bold">Permanent Address</label>
        <input type="text" name="street" placeholder="Street Address" class="w-full border p-2.5 rounded-lg mt-2">
        <div class="grid md:grid-cols-3 gap-3 mt-3">
          <input type="text" name="city" placeholder="City" class="border p-2.5 rounded-lg">
          <input type="text" name="state" placeholder="State" class="border p-2.5 rounded-lg">
          <input type="text" name="zip" placeholder="Zip Code" class="border p-2.5 rounded-lg">
        </div>
      </div>

      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="font-bold">Applicant's Phone & Email</label>
          <input type="tel" name="phone" placeholder="Phone No" class="w-full border p-2.5 rounded-lg mt-2">
          <input type="email" name="email" placeholder="Email ID" class="w-full border p-2.5 rounded-lg mt-2">
        </div>
        <div>
          <label class="font-bold">Parent / Guardian's Phone</label>
          <input type="tel" name="g_phone" placeholder="Guardian Phone" class="w-full border p-2.5 rounded-lg mt-2">
        </div>
      </div>

      <div>
        <label class="font-bold">Academic Qualifications</label>
        <textarea name="qualifications" rows="4" class="w-full border p-2.5 rounded-lg mt-2"></textarea>
      </div>

      <div>
        <label class="font-bold">Applicant's Signature</label>
        <textarea name="signature" rows="2" class="w-full border p-2.5 rounded-lg mt-2" placeholder="Type your full name"></textarea>
      </div>

      <div class="flex gap-3">
        <button type="submit" class="flex-1 bg-black text-white py-3 rounded-xl font-bold">Submit to Server</button>
        <button type="reset" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold">Reset</button>
      </div>

    </form>
  </div>
</body>
</html>
